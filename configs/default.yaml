# Full training configuration matching original notebook
data:
  dataset: "mnist"
  buffer_size: 60000
  batch_size: 256
  image_shape: [28, 28, 1]
  num_classes: 10
  normalize_to_neg1_1: true

model:
  latent_dim: 100
  label_embedding_dim: 50
  generator_base_filters: [256, 128, 64]
  discriminator_base_filters: [64, 128]
  generator_upsample_filters: [128, 64, 1]
  discriminator_dropout_rate: 0.3
  leaky_relu_alpha: 0.2
  batch_norm_momentum: 0.9

training:
  epochs: 300
  generator_learning_rate: 2e-4
  discriminator_learning_rate: 1e-5
  adam_beta_1: 0.5
  label_smoothing: 0.9
  seed: 42
  steps_per_epoch: null  # Will be calculated based on dataset size

outputs:
  checkpoint_dir: "outputs/checkpoints"
  samples_dir: "outputs/samples"
  figures_dir: "outputs/figures"
  logs_dir: "outputs/logs"
  reports_dir: "outputs/reports"
